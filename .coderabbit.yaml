# CodeRabbit configuration — https://docs.coderabbit.ai/getting-started/configure-coderabbit
# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

language: en-US

reviews:
  profile: chill
  pre_merge_checks:
    # ShieldVault documents its *contracts* (the background message API, the
    # detector shape, the validators) — not every trivial helper. An 80% blanket
    # docstring target would reward noise over signal, so we hold a deliberate,
    # lower bar and enforce it as a warning. See STANDARDS.md for the rule.
    docstrings:
      threshold: 40
