<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>userp.ly</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 0;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid rgba(148,163,184,0.1);
    }
    .header svg { width: 18px; height: 18px; color: #4ade80; flex-shrink: 0; }
    .header .name { font-size: 13px; font-weight: 700; color: #fff; }
    .header .version { font-size: 10px; color: #64748b; margin-left: auto; }
    .status { padding: 16px; }
    .status-row { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.green { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.4); }
    .status-dot.red { background: #f87171; }
    .status-text { font-size: 12px; color: #94a3b8; }
    .info { padding: 0 16px 16px; font-size: 11px; color: #64748b; line-height: 1.5; }
    .divider { height: 1px; background: rgba(148,163,184,0.1); margin: 0 16px; }
    .actions {
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-secondary {
      background: rgba(148,163,184,0.08);
      color: #94a3b8;
      border: 1px solid rgba(148,163,184,0.15);
    }
    .btn-secondary:hover { background: rgba(148,163,184,0.12); color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <span class="name">userp.ly</span>
    <span class="version">v1.0</span>
  </div>
  <div class="status">
    <div class="status-row">
      <div class="status-dot green" id="status-dot"></div>
      <span class="status-text" id="status-text">Active on search pages</span>
    </div>
  </div>
  <div class="info">Shows publish dates on Google, Bing, and DuckDuckGo search results. Dates are extracted directly from snippets.</div>
  <div class="divider"></div>
  <div class="actions">
    <a href="settings.html" target="_blank" class="btn btn-secondary">Settings</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
